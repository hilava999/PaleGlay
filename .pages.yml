media:
  input: public/images
  output: /images

content:
  - name: "novel"
    label: "小説作品"
    type: "collection"
    path: "src/content/novel"
    fields:
      - name: "title"
        label: "タイトル"
        type: "string"
      - name: "date"
        label: "公開日"
        type: "date"
        required: false
        options:
          format: "yyyy-MM-dd"
      - name: "draft"
        label: "下書き"
        type: "boolean"
        default: false
      - name: "cc"
        label: "お相手"
        type: "string"
      - name: "defaultName"
        label: "夢主のデフォルトネーム"
        type: "string"
        required: false
      - name: "desc"
        label: "概要"
        type: "text"
        required: false
      - name: "tags"
        label: "タグ"
        type: "string"
        list: true
        required: false
      - name: "body"
        label: "小説本文"
        type: "rich-text"
        required: false

  - name: "memo"
    label: "メモ"
    type: "collection"
    path: "src/content/memo"
    fields:
      - name: "title"
        label: "タイトル"
        type: "string"
      - name: "date"
        label: "投稿日"
        type: "date"
        options:
          format: "yyyy-MM-dd"
      - name: "draft"
        label: "下書き"
        type: "boolean"
        default: false
      - name: "body"
        label: "本文"
        type: "rich-text"
        required: false

  - name: "settings"
    label: "サイトの設定"
    type: "file"
    path: "src/content/settings/index.json"
    fields:
      - name: "siteTitle"
        label: "サイトタイトル"
        type: "string"
      - name: "subTitle"
        label: "サブタイトル"
        type: "string"
        required: false
      - name: "headerImage"
        label: "ヘッダー画像"
        type: "image"
        required: false
      - name: "desc"
        label: "サイト説明文 (Desc)"
        type: "text"
        required: false
      - name: "about"
        label: "サイト説明文 (About)"
        type: "text"
        required: false
      - name: "favicon"
        label: "ファビコン"
        type: "image"
        required: false
      - name: "lastUpdate"
        label: "最終更新日"
        type: "date"
        required: false
        options:
          format: "yyyy-MM-dd"
      - name: "ogImage"
        label: "OGP画像"
        type: "image"
        required: false
      - name: "prof"
        label: "プロフィール設定 (prof)"
        type: "object"
        fields:
          - name: "author"
            label: "作者名"
            type: "string"
          - name: "bio"
            label: "自己紹介文"
            type: "text"
            required: false
      - name: "sns"
        label: "SNSリンク一覧"
        type: "object"
        list: true
        required: false
        fields:
          - name: "platform"
            label: "プラットフォーム"
            type: "select"
            options:
              values:
                - label: "X (Twitter)"
                  value: "x"
                - label: "Bluesky"
                  value: "bluesky"
                - label: "Pixiv"
                  value: "pixiv"
                - label: "GitHub"
                  value: "github"
          - name: "url"
            label: "URL"
            type: "string"